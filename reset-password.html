<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — TBK</title>
<link rel="icon" type="image/png" href="images/logo-tbk-rond.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <img src="images/logo-tbk-rond.png" alt="" class="logo-mark-img">
      TBK
    </a>
    <nav class="main-nav">
      <a href="index.html#club">Le club</a>
    </nav>
  </div>
</header>

<main class="wrap page-section">
  <p class="section-eyebrow">Réinitialisation</p>
  <h1>Choisissez un nouveau mot de passe</h1>

  <div id="resetPanel" class="status-panel" hidden>
    <form id="resetForm" class="contact-form">
      <label>Nouveau mot de passe <input type="password" name="password" required minlength="6"></label>
      <label>Confirmez le mot de passe <input type="password" name="confirm" required minlength="6"></label>
      <button type="submit" class="btn btn-primary">Enregistrer le nouveau mot de passe</button>
      <p class="form-hint" id="resetHint"></p>
    </form>
  </div>

  <div id="invalidPanel" class="status-panel" hidden>
    <h2>Lien invalide ou expiré</h2>
    <p>Ce lien de réinitialisation n'est plus valable. Redemandez-en un depuis <a href="membres.html">l'espace membres</a> ou depuis l'administration.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>TBK — Club de Badminton &amp; Tennis de Table de Kersaint-Plabennec</span>
    <a href="index.html">Retour à l'accueil</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script>
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function initResetPage() {
    // Le lien envoyé par email établit automatiquement une session de type "recovery".
    const { data: { session } } = await sbClient.auth.getSession();
    const resetPanel = document.getElementById('resetPanel');
    const invalidPanel = document.getElementById('invalidPanel');

    if (!session) {
      invalidPanel.hidden = false;
      return;
    }
    resetPanel.hidden = false;
  }

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const hint = document.getElementById('resetHint');
    const fd = new FormData(e.target);
    const password = fd.get('password');
    const confirm = fd.get('confirm');

    if (password !== confirm) {
      hint.textContent = 'Les deux mots de passe ne correspondent pas.';
      return;
    }

    hint.textContent = 'Enregistrement…';
    const { error } = await sbClient.auth.updateUser({ password });
    if (error) {
      hint.textContent = 'Erreur : ' + error.message;
      return;
    }
    hint.textContent = 'Mot de passe mis à jour ! Vous pouvez maintenant vous connecter.';
    e.target.reset();
  });

  document.addEventListener('DOMContentLoaded', initResetPage);
</script>
</body>
</html>
