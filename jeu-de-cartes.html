<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" type="image/png" href="images/logo-tbk-rond.png">
<title>Jeu de cartes — TBK</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="cartes-body">

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <img src="images/logo-tbk-rond.png" alt="" class="logo-mark-img">
      TBK
    </a>
    <nav class="main-nav">
      <a href="index.html#club">Le club</a>
    </nav>
    <a href="#" id="headerContactMail" class="header-icon-btn" title="Contacter le club par email" aria-label="Contacter le club par email" hidden>✉️</a>
    <span class="auth-state" id="authState"></span>
    <button class="nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div id="deniedPanel" class="status-panel" hidden style="margin:24px auto; max-width:600px;">
  <h2>Accès refusé</h2>
  <p>Vous n'avez pas accès à cette page. Un administrateur peut vous y donner accès depuis Administration → Profils.</p>
</div>

<main id="cartesMain" class="cartes-main" hidden>

  <div class="cartes-topbar">
    <h1>Jeu de cartes</h1>
    <div class="cartes-setup">
      <input type="number" id="nbJoueursInput" min="1" max="41" value="16" aria-label="Nombre de joueurs">
      <button type="button" class="btn btn-primary btn-small" id="creerSessionBtn">Créer la session</button>
    </div>
    <p class="form-hint" id="setupHint"></p>
  </div>

  <div id="jeuZone" class="jeu-zone" hidden>
    <div class="carte-progress" id="carteProgress"></div>

    <div class="carte-affichage">
      <div class="carte-geante carte-dos" id="carteGeante">
        <span class="carte-dos-motif">🏸</span>
      </div>
    </div>

    <div class="carte-message" id="carteMessage">Appuyez sur "Carte" pour commencer le tirage.</div>
  </div>

  <div class="cartes-bottombar" id="cartesBottombar" hidden>
    <button type="button" class="btn-carte-geant" id="carteBtn">Carte</button>
  </div>

</main>

<footer class="site-footer cartes-footer">
  <div class="wrap footer-inner">
    <span>TBK — Club de Badminton &amp; Tennis de Table de Kersaint-Plabennec</span>
    <a href="index.html">Retour à l'accueil</a>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script src="js/jeu-de-cartes.js"></script>
</body>
</html>
